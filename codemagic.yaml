workflows:
  ios-release-ipa:
    name: iOS Release Build (Unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: 🔧 Prepare environment
        script: |
          #!/bin/bash
          set -e
          echo "🧹 Cleaning Flutter and reinstalling dependencies..."
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          cd ios
          pod repo update
          pod install
          cd ..

      - name: ⚙️ Copy environment file
        script: |
          cp .env.example .env || true

      - name: 🚀 Build iOS release (no codesign)
        script: |
          #!/bin/bash
          set -e
          echo "📦 Building Flutter iOS release app (no codesign)..."
          flutter build ios --release --no-codesign

      - name: 📁 Package .ipa file
        script: |
          #!/bin/bash
          set -e
          echo "📦 Creating unsigned .ipa package..."

          # Create a Payload folder for iOS .ipa structure
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/

          # Zip into IPA format
          zip -r Runner_Release_Unsigned.ipa Payload

          # Move to artifacts folder
          mkdir -p ~/build_artifacts
          mv Runner_Release_Unsigned.ipa ~/build_artifacts/

          # Clean up
          rm -rf Payload

    artifacts:
      - ~/build_artifacts/Runner_Release_Unsigned.ipa
