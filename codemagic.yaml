workflows:
  ios-workflow:
    name: iOS Debug Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build unsigned iOS app
        script: |
          flutter build ios --debug --no-codesign
          ls -la build/ios/iphoneos/
    artifacts:
      - build/ios/iphoneos/**/*.app
