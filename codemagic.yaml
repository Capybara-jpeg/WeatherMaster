flutter clean
rm -rf ios/Pods ios/Podfile.lock
flutter pub get
cd ios
pod repo update
pod install
cd ..
workflows:
  ios-workflow:
    name: iOS Debug Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Copy .env.example to .env
        script: |
          cp .env.example .env
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
          cd ..
      - name: Build with xcodebuild directly
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates
          cd ..
          ls -la ios/build/Debug-iphoneos/
    artifacts:
      - ios/build/Debug-iphoneos/**/*.app
